# p2gift — Cloudflare Worker, MCP Streamable HTTP at /mcp
# Custom domain p2gift.keeg.uk is attached once in the Cloudflare
# dashboard (Workers -> p2gift -> Settings -> Domains) and persists
# across deploys. Do not add it to this file.
name = "p2gift"
compatibility_date = "2026-11-06"
main = "src/index.js"

[[r2_buckets]]
binding = "P2GIFT_BUCKET"
bucket_name = "p2gift"

[observability]
enabled = true

# API-key store: KV key = SHA-256 hex digest of the customer's key,
# value = {"customer","created"}. The namespace id below must be filled
# in after creating the namespace (dashboard or API) — deploy fails
# without a real id.
[[kv_namespaces]]
binding = "P2GIFT_KEYS"
id = "eb35d5400a4d4cc0a5cfab0333e2f2e9"
